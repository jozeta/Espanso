# =============================================================================
# secrets.yml — Secrets & code security triggers
# Place in: ~/.config/espanso/match/
# Covers: secret scanning, dependency auditing, SAST
# =============================================================================

matches:

  # ---------------------------------------------------------------------------
  # SECRET SCANNING
  # ---------------------------------------------------------------------------

  - trigger: ":gitleaksscan"
    replace: "gitleaks detect --source . --report-format json --report-path gitleaks-report.json"

  - trigger: ":gitleaksstaged"
    replace: "gitleaks protect --staged"

  - trigger: ":trufflehogscan"
    replace: "trufflehog git file://. --only-verified"

  - trigger: ":gitsecrethistory"
    replace: "git log -p --all | grep -iE 'password|secret|api[_-]?key|token'"

  # ---------------------------------------------------------------------------
  # DEPENDENCY / SAST
  # ---------------------------------------------------------------------------

  - trigger: ":npmaudit"
    replace: "npm audit --production"

  - trigger: ":pipaudit"
    replace: "pip-audit"

  - trigger: ":semgrepscan"
    replace: "semgrep --config auto ."

  - trigger: ":sastreport"
    replace: |
      SAST / Code Review Finding
      -----------------------------
      Rule / CWE:
      File:
      Line:
      Severity:      [Critical / High / Medium / Low]
      Description:
      Remediation:
