# =============================================================================
# cli.yml — Command-line snippet triggers
# Place in: your Espanso match directory (`espanso path` shows the config folder)
# Covers: PowerShell, Azure CLI, KQL stubs, general shell utilities, Windows and macOS host triage
# =============================================================================

matches:

  # ---------------------------------------------------------------------------
  # POWERSHELL — Entra ID / M365
  # ---------------------------------------------------------------------------

  # Connect to Microsoft Graph
  - trigger: ":psgraph"
    replace: "Connect-MgGraph -Scopes 'User.Read.All','AuditLog.Read.All','Directory.Read.All'"

  # Get Entra ID sign-in logs for a UPN
  - trigger: ":pssignin"
    replace: "Get-MgAuditLogSignIn -Filter \"userPrincipalName eq 'user@domain.com'\" -Top 100 | Select-Object CreatedDateTime, AppDisplayName, IpAddress, Status, ConditionalAccessStatus"

  # Revoke all refresh tokens for a user
  - trigger: ":psrevoke"
    replace: "Revoke-MgUserSignInSession -UserId 'user@domain.com'"

  # Disable Entra ID user account
  - trigger: ":psdisable"
    replace: "Update-MgUser -UserId 'user@domain.com' -AccountEnabled:$false"

  # List MFA methods for a user
  - trigger: ":psmfa"
    replace: "Get-MgUserAuthenticationMethod -UserId 'user@domain.com' | Select-Object Id, AdditionalProperties"

  # Get all members of a privileged role
  - trigger: ":psrole"
    replace: "Get-MgDirectoryRoleMember -DirectoryRoleId '' | Select-Object Id, DisplayName, UserPrincipalName"

  # ---------------------------------------------------------------------------
  # POWERSHELL — MDE / Defender
  # ---------------------------------------------------------------------------

  # There are no Graph PowerShell cmdlets for these actions; they are REST calls to the
  # Defender for Endpoint API (learn.microsoft.com/defender-endpoint/api/isolate-machine).
  # $token = a bearer token for https://api.securitycenter.microsoft.com with the
  # Machine.Isolate / Machine.LiveResponse permission.

  # Isolate a device via the MDE API (IsolationType: Full | Selective | UnManagedDevice)
  - trigger: ":mdeisolate"
    replace: "Invoke-RestMethod -Method Post -Uri 'https://api.security.microsoft.com/api/machines/<machine-id>/isolate' -Headers @{Authorization=\"Bearer $token\"} -ContentType 'application/json' -Body (@{Comment='IR containment — [INC-XXXX]'; IsolationType='Full'} | ConvertTo-Json)"

  # Release a device from isolation
  - trigger: ":mdeunisolate"
    replace: "Invoke-RestMethod -Method Post -Uri 'https://api.security.microsoft.com/api/machines/<machine-id>/unisolate' -Headers @{Authorization=\"Bearer $token\"} -ContentType 'application/json' -Body (@{Comment='Released from isolation — [INC-XXXX]'} | ConvertTo-Json)"

  # Run a live response script (from the MDE library) on a device
  - trigger: ":mdelive"
    replace: "Invoke-RestMethod -Method Post -Uri 'https://api.security.microsoft.com/api/machines/<machine-id>/runliveresponse' -Headers @{Authorization=\"Bearer $token\"} -ContentType 'application/json' -Body (@{Comment='[INC-XXXX]'; Commands=@(@{type='RunScript'; params=@(@{key='ScriptName'; value='<script.ps1>'})})} | ConvertTo-Json -Depth 5)"

  # ---------------------------------------------------------------------------
  # AZURE CLI
  # ---------------------------------------------------------------------------

  # Login to Azure
  - trigger: ":azlogin"
    replace: "az login --tenant <tenant-id>"

  # Set active subscription
  - trigger: ":azsub"
    replace: "az account set --subscription '<subscription-id>'"

  # List all role assignments for a resource
  - trigger: ":azrole"
    replace: "az role assignment list --all --include-inherited --output table"

  # List diagnostic settings for a resource
  - trigger: ":azdiag"
    replace: "az monitor diagnostic-settings list --resource '' --output table"

  # Export activity log to JSON
  - trigger: ":azactivity"
    replace: "az monitor activity-log list --start-time '' --end-time '' --output json > activity_log.json"

  # List storage accounts and public access status
  - trigger: ":azstorage"
    replace: "az storage account list --query '[].{Name:name, PublicAccess:allowBlobPublicAccess, HTTPS:enableHttpsTrafficOnly}' --output table"

  # ---------------------------------------------------------------------------
  # KQL — Sentinel / Defender stubs
  # ---------------------------------------------------------------------------

  # Generic time-bounded table query stub
  - trigger: ":kqlstart"
    replace: |
      // Query: [description]
      // Timeframe: last Xh
      TableName
      | where TimeGenerated > ago(Xh)
      | where 
      | project TimeGenerated, 
      | sort by TimeGenerated desc

  # SigninLogs — failed logins stub
  - trigger: ":kqlsignin"
    replace: |
      SigninLogs
      | where TimeGenerated > ago(24h)
      | where ResultType != "0"                          // non-success only
      | summarize Attempts = count() by UserPrincipalName, IPAddress, ResultType, ResultDescription
      | sort by Attempts desc

  # SecurityAlert — MDE alert lookup
  - trigger: ":kqlalert"
    replace: |
      SecurityAlert
      | where TimeGenerated > ago(24h)
      | where AlertSeverity in ("High", "Critical")
      | project TimeGenerated, AlertName, AlertSeverity, CompromisedEntity, Entities, RemediationSteps
      | sort by TimeGenerated desc

  # DeviceProcessEvents — process execution stub
  - trigger: ":kqlproc"
    replace: |
      DeviceProcessEvents
      | where Timestamp > ago(24h)
      | where DeviceName == ""
      | project Timestamp, DeviceName, InitiatingProcessFileName, FileName, ProcessCommandLine, AccountName
      | sort by Timestamp desc

  # ---------------------------------------------------------------------------
  # GENERAL SHELL UTILITIES
  # ---------------------------------------------------------------------------

  # Base64 encode a string (PowerShell)
  - trigger: ":b64enc"
    replace: "[Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes(''))"

  # Base64 decode (PowerShell)
  - trigger: ":b64dec"
    replace: "[Text.Encoding]::Unicode.GetString([Convert]::FromBase64String(''))"

  # Hash a file — SHA256 (PowerShell)
  - trigger: ":sha256"
    replace: "Get-FileHash -Path '' -Algorithm SHA256 | Select-Object -ExpandProperty Hash"

  # Grep for IP addresses in a log file (bash)
  - trigger: ":grepip"
    replace: "grep -oE '([0-9]{1,3}\\.){3}[0-9]{1,3}' "

  # Tail a log file with timestamp
  - trigger: ":logtail"
    replace: "tail -f  | ts '[%Y-%m-%d %H:%M:%S]'"

  # Netstat active connections (Windows)
  - trigger: ":netstat"
    replace: "netstat -ano | findstr ESTABLISHED"

  # List processes sorted by CPU (Linux)
  - trigger: ":psaux"
    replace: "ps aux --sort=-%cpu | head -20"

  # List listening sockets and owning process (Linux)
  - trigger: ":lsof"
    replace: "lsof -i -P -n | grep LISTEN"

  # ---------------------------------------------------------------------------
  # WINDOWS — DEFENDER / FIREWALL / HOST TRIAGE
  # ---------------------------------------------------------------------------

  # Trigger a full Defender scan
  - trigger: ":defenderscan"
    replace: "Start-MpScan -ScanType FullScan"

  # Force Defender signature update
  - trigger: ":defenderupdate"
    replace: "Update-MpSignature"

  # List enabled firewall rules
  - trigger: ":fwrules"
    replace: "Get-NetFirewallRule -Enabled True | Select-Object DisplayName, Direction, Action"

  # List enabled scheduled tasks (persistence check)
  - trigger: ":schtasks"
    replace: "Get-ScheduledTask | Where-Object { $_.State -ne 'Disabled' } | Select-Object TaskName, TaskPath, State"

  # List local administrators (privilege check)
  - trigger: ":localadmins"
    replace: "Get-LocalGroupMember -Group 'Administrators'"

  # Pull recent Security event log entries
  - trigger: ":winevents"
    replace: "Get-WinEvent -LogName Security -MaxEvents 50 | Select-Object TimeCreated, Id, Message"

  # Enumerate SMB shares
  - trigger: ":sharesenum"
    replace: "Get-SmbShare"

  # List established TCP connections with owning process
  - trigger: ":procnetconn"
    replace: "Get-NetTCPConnection -State Established | Select-Object LocalAddress, RemoteAddress, RemotePort, OwningProcess"

  # List running services (persistence / unusual service check)
  - trigger: ":svcenum"
    replace: "Get-Service | Where-Object { $_.Status -eq 'Running' } | Select-Object Name, DisplayName"

  # ---------------------------------------------------------------------------
  # macOS — HOST TRIAGE
  # ---------------------------------------------------------------------------

  # Search the unified log (full path: in zsh, `log` is a shell builtin)
  - trigger: ":maclogshow"
    replace: "/usr/bin/log show --last 1h --style syslog --predicate 'eventMessage CONTAINS[c] \"<text>\"'"

  # Collect the unified log as evidence (.logarchive, open with `log show <file>`)
  - trigger: ":maclogcollect"
    replace: "sudo /usr/bin/log collect --last 1d --output ~/Desktop/"

  # Launch agents / daemons outside Apple's own (persistence check)
  - trigger: ":macpersist"
    replace: "ls -la /Library/LaunchAgents /Library/LaunchDaemons ~/Library/LaunchAgents 2>/dev/null; launchctl list | grep -v 'com\\.apple\\.'"

  # Background Task Management: login items and launch items as macOS 13+ records them
  - trigger: ":macbtm"
    replace: "sudo sfltool dumpbtm"

  # Installed configuration profiles (MDM, or a persistence / proxy vector)
  - trigger: ":macprofiles"
    replace: "sudo profiles show -all"

  # Download history from the quarantine events database
  - trigger: ":macquarantine"
    replace: "sqlite3 ~/Library/Preferences/com.apple.LaunchServices.QuarantineEventsV2 'SELECT datetime(LSQuarantineTimeStamp + 978307200, \"unixepoch\"), LSQuarantineAgentName, LSQuarantineDataURLString, LSQuarantineOriginURLString FROM LSQuarantineEvent ORDER BY LSQuarantineTimeStamp DESC LIMIT 50'"

  # Privacy (TCC) grants per app; the terminal needs Full Disk Access
  - trigger: ":mactcc"
    replace: "sqlite3 ~/Library/Application\\ Support/com.apple.TCC/TCC.db 'SELECT client, service, auth_value FROM access ORDER BY client'"

  # Code signature, notarisation and quarantine flag of an app or binary
  - trigger: ":macsign"
    replace: "codesign -dv --verbose=4 '<path>' 2>&1; spctl -a -vv '<path>'; xattr -l '<path>'"

  # Security posture: SIP, Gatekeeper, FileVault
  - trigger: ":macsecstatus"
    replace: "csrutil status; spctl --status; fdesetup status"

  # Established network connections with owning process
  - trigger: ":macnet"
    replace: "lsof -nP -iTCP -sTCP:ESTABLISHED"

  # Local user accounts (hides _system accounts)
  - trigger: ":macusers"
    replace: "dscl . list /Users UniqueID | grep -v '^_'"
