# =============================================================================
# timestamps.yml — Date & time expansion triggers
# Place in: ~/.config/espanso/match/
# =============================================================================

matches:

  # ---------------------------------------------------------------------------
  # Current date — "28 Mar 2026"
  # ---------------------------------------------------------------------------
  - trigger: ":date"
    replace: "{{day}} {{month}} {{year}}"
    vars:
      - name: day
        type: date
        params:
          format: "%d"
      - name: month
        type: date
        params:
          format: "%b"
      - name: year
        type: date
        params:
          format: "%Y"

  # ---------------------------------------------------------------------------
  # Current UTC timestamp — "28 Mar 2026 14:00 UTC"
  # ---------------------------------------------------------------------------
  - trigger: ":utc"
    replace: "{{ts}} UTC"
    vars:
      - name: ts
        type: date
        params:
          format: "%d %b %Y %H:%M"

  # ---------------------------------------------------------------------------
  # ISO 8601 UTC — "2026-03-28T14:00:00Z"
  # ---------------------------------------------------------------------------
  - trigger: ":iso"
    replace: "{{ts}}Z"
    vars:
      - name: ts
        type: date
        params:
          format: "%Y-%m-%dT%H:%M:%S"

  # ---------------------------------------------------------------------------
  # Date only, numeric — "2026-03-28"
  # ---------------------------------------------------------------------------
  - trigger: ":dateiso"
    replace: "{{ts}}"
    vars:
      - name: ts
        type: date
        params:
          format: "%Y-%m-%d"

  # ---------------------------------------------------------------------------
  # Current year — "2026"
  # ---------------------------------------------------------------------------
  - trigger: ":year"
    replace: "{{yr}}"
    vars:
      - name: yr
        type: date
        params:
          format: "%Y"

  # ---------------------------------------------------------------------------
  # Incident window placeholder — paste and fill start/end
  # ---------------------------------------------------------------------------
  - trigger: ":timewindow"
    replace: "[START: DD Mon YYYY HH:MM UTC] – [END: DD Mon YYYY HH:MM UTC]"

  # ---------------------------------------------------------------------------
  # Current local time — "14:00"
  # ---------------------------------------------------------------------------
  - trigger: ":time"
    replace: "{{t}}"
    vars:
      - name: t
        type: date
        params:
          format: "%H:%M"

  # ---------------------------------------------------------------------------
  # Current time, 12-hour — "2:00 PM"
  # ---------------------------------------------------------------------------
  - trigger: ":ts12"
    replace: "{{t}}"
    vars:
      - name: t
        type: date
        params:
          format: "%I:%M %p"

  # ---------------------------------------------------------------------------
  # Day of week — "Saturday"
  # ---------------------------------------------------------------------------
  - trigger: ":dow"
    replace: "{{d}}"
    vars:
      - name: d
        type: date
        params:
          format: "%A"

  # ---------------------------------------------------------------------------
  # ISO 8601 local (no Z / offset) — "2026-03-28T14:00:00"
  # ---------------------------------------------------------------------------
  - trigger: ":isolocal"
    replace: "{{t}}"
    vars:
      - name: t
        type: date
        params:
          format: "%Y-%m-%dT%H:%M:%S"

  # ---------------------------------------------------------------------------
  # Unix epoch seconds
  # ---------------------------------------------------------------------------
  - trigger: ":epoch"
    replace: "{{t}}"
    vars:
      - name: t
        type: date
        params:
          format: "%s"

  # ---------------------------------------------------------------------------
  # ISO week number — "13"
  # ---------------------------------------------------------------------------
  - trigger: ":weekno"
    replace: "{{t}}"
    vars:
      - name: t
        type: date
        params:
          format: "%V"
